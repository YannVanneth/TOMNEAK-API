spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/default/jwks
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: user-service-test-group
    listener:
      auto-startup: false


eureka:
  client:
    enabled: false

app:
  kafka:
    topic: user.registration



