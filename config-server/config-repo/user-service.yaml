spring:
  datasource:
    url: jdbc:postgresql://localhost:5001/user-service-db
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  data:
    jpa:
      hibernate:
        ddl-auto: none
      database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/tomneak
          jwk-set-uri: http://localhost:8080/realms/tomneak/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

server:
  port: 8001
